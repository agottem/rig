#cloud-config
package_update: true
packages:
  - bash
  - ca-certificates
  - curl
  - git
  - jq
  - less
  - nano
  - nodejs
  - npm
  - python3
  - python3-pip
  - python3-venv
  - build-essential
  - ripgrep
  - unzip
  - wget
  - net-tools
  - traceroute
  - nmap
  - tcpdump
  - dnsutils
  - strace
  - gdb
  - w3m
  - w3m-img
users:
  - name: agent
    shell: /bin/bash
    lock_passwd: true